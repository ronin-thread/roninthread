<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Product | Ronin Thread</title>
    <meta name="description" content="Discover premium Japanese-inspired streetwear from Ronin Thread. Forged for discipline, resilience and modern minimalism.">
    <link rel="canonical" href="https://ronin-thread.vercel.app/product.html">

    <!-- Search Engines -->
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Ronin Thread">
    <meta property="og:description" content="Premium Japanese-inspired streetwear forged for the modern ronin.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://ronin-thread.vercel.app/images/home/og_image.webp">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ronin Thread">
    <meta name="twitter:description" content="Premium Japanese-inspired streetwear forged for the modern ronin.">
    <meta name="twitter:image" content="https://ronin-thread.vercel.app/images/home/og_image.webp">

    <!-- Theme -->
    <meta name="theme-color" content="#000000">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/home/favicon.svg">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="index.html" class="logo">

            <div class="enso"></div>

            <span>RONIN THREAD</span>

        </a>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

        </ul>

    </nav>

</header>

<section class="product-page">

    <a
        id="backLink"
        href="#"
        class="back-link"
    >
        ← Return to Collection
    </a>

    <div class="product-layout">

        <!-- IMAGE -->

        <div class="product-image">

            <button class="slider-btn left"
                id="prevBtn">
        
                &#10094;
        
            </button>
        
            <img
                id="productImage"
                src=""
                alt="Product Mockup">
        
            <button class="slider-btn right"
                id="nextBtn">
        
                &#10095;
        
            </button>

            <div id="sliderDots" class="slider-dots">

            </div>
        
        </div>

        <!-- INFO -->

        <div class="product-details">

            <p
                id="productCollection"
                class="product-collection">

                COLLECTION

            </p>

            <h1
                id="productTitle">

                Loading...

            </h1>

            <p
                id="productDescription"
                class="product-description">

                Loading...

            </p>

            <a
                id="buyButton"
                href="#"
                target="_blank"
                class="cta-btn">

                Get This Piece →

            </a>

        </div>

    </div>

</section>

<script src="js/product.js"></script>
<script src="js/load-footer.js"></script>
<div id="footer"></div>
<script src="js/scroll-reveal.js"></script>

</body>

</html>
